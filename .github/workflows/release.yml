name: tag and release

on:
  push:
    branches:
      - main
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Get version
        id: get_version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate version.go
        run: |
          cat > cmd/viztruct/version.go << EOF
          package main

          // Code generated by release workflow. DO NOT EDIT.

          // Version is the current version of viztruct.
          const Version = "${{ steps.get_version.outputs.current_version }}"
          EOF
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git add cmd/viztruct/version.go
          git commit -m "chore: update version [skip ci]"
          git push

      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -o bin/viztruct-linux-amd64 ./cmd/viztruct
          GOOS=linux GOARCH=arm64 go build -o bin/viztruct-linux-arm64 ./cmd/viztruct
          GOOS=darwin GOARCH=amd64 go build -o bin/viztruct-darwin-amd64 ./cmd/viztruct
          GOOS=darwin GOARCH=arm64 go build -o bin/viztruct-darwin-arm64 ./cmd/viztruct

      - name: Create and push tag
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git tag ${{ steps.get_version.outputs.current_version }}
          git push origin ${{ steps.get_version.outputs.current_version }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.current_version }}
          files: |
            bin/viztruct-darwin-amd64
            bin/viztruct-darwin-arm64
            bin/viztruct-linux-amd64
            bin/viztruct-linux-arm64
          generate_release_notes: true
          draft: false
          prerelease: false

